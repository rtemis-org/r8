[package]
name = 'r8-r'
publish = false
version = '0.4.0'
edition = '2024'
rust-version = '1.88'

# The crate is its own workspace root, so it builds the same inside the r8
# checkout, in R CMD check directories, and from the source tarball.
[workspace]

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'r8_r'

[[bin]]
name = 'document'
path = 'document.rs'

# `oracle`: the differential oracle that the tests compare in-place
# construction with (src/oracle.rs); tools/config.R enables it when R8_ORACLE is
# set.
[features]
oracle = []
alloc-stats = []

[dependencies]
extendr-api = '0.9'
extendr-ffi = '0.9'
rtemis-r8 = '0.4'
serde = '1'
serde_json = { version = '1', features = ['float_roundtrip', 'preserve_order'] }

[profile.release]
lto = true
codegen-units = 1
