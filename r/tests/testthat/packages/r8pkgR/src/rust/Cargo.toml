[package]
name = "r8pkgr"
version = "0.0.1"
edition = "2024"
publish = false

# Its own workspace root, inside the R8 checkout.
[workspace]

# A static library for this package, and a Rust library for the crate of
# r8pkgS, which depends on it.
[lib]
crate-type = ["staticlib", "lib"]
path = "src/lib.rs"

[dependencies]
rtemis-r8 = { path = "../../../../../../../rust/crates/rtemis-r8", features = ["macros"] }
rtemis-r8-api = { path = "../../../../../../../rust/crates/rtemis-r8-api" }

[profile.release]
codegen-units = 1
