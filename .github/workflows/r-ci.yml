name: R CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, devel]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  # tools/config.R patches the crates.io release of rtemis-r8 with this checkout's
  # crate.
  R8_CRATES_PATH: ${{ github.workspace }}/rust/crates
  # The differential oracle that test-construct.R compares in-place
  # construction with; the tests fail when it is set and the oracle is missing.
  R8_ORACLE: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check that the R package and the crates share a major and minor version
        run: bash tools/check-versions.sh

  r-cmd-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      # R CMD check runs checkbashisms (from devscripts) on configure and cleanup.
      - name: Install checkbashisms
        run: sudo apt-get update && sudo apt-get install -y devscripts
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
          # Save dependencies even when a later check fails.
          cache: always
          cache-version: 1
      - uses: r-lib/actions/check-r-package@v2
        timeout-minutes: 20
        with:
          working-directory: r
          upload-snapshots: true
          # The check builds against this checkout's rtemis-r8; an error fails
          # the job.
          error-on: '"error"'
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
      - name: Preserve incomplete check diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: check-diagnostics
          path: r/check
          if-no-files-found: ignore

  rust:
    name: Rust (binding crate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: r/src/rust
    steps:
      - uses: actions/checkout@v6
      # extendr-ffi links against R, so R is present for the build.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      # The patch rewrites the lock's rtemis-r8 entry without its crates.io
      # source, so this step runs without --locked; the job `vendored` builds
      # from the committed lock.
      - run: cargo clippy --all-targets --config "patch.crates-io.rtemis-r8.path=\"$R8_CRATES_PATH/rtemis-r8\"" -- -D warnings
      - run: cargo clippy --all-targets --features oracle --config "patch.crates-io.rtemis-r8.path=\"$R8_CRATES_PATH/rtemis-r8\"" -- -D warnings
      - run: cargo clippy --all-targets --features alloc-stats --config "patch.crates-io.rtemis-r8.path=\"$R8_CRATES_PATH/rtemis-r8\"" -- -D warnings

  msrv:
    name: Install with the minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: r
    steps:
      - uses: actions/checkout@v6
      # The minimum version is the rustc entry of SystemRequirements in DESCRIPTION.
      - name: Read the minimum Rust version
        id: msrv
        run: echo "version=$(grep -oE 'rustc >= [0-9.]+' DESCRIPTION | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Build and install the source package
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          R CMD build --no-manual .
          R CMD INSTALL R8_*.tar.gz
          Rscript -e 'stopifnot(grepl("^[0-9]+[.][0-9]+[.][0-9]+", R8::r8_runtime_version()))'
      # CRAN builds install the committed R/extendr-wrappers.R; a development
      # build regenerates it from the Rust doc comments, and the two must match.
      - name: Check that R/extendr-wrappers.R is current
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
          NOT_CRAN: "true"
        run: |
          R CMD INSTALL --no-test-load .
          git diff --exit-code R/extendr-wrappers.R

  vendored:
    name: Install from the vendored crates
    # The release line builds from crates.io: pushes to main, pull requests
    # into main, and manual runs. devel builds against this checkout's crates,
    # which may hold items no release of rtemis-r8 has.
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: r
    env:
      # Empty: the build compiles the crates.io release of rtemis-r8 from
      # src/rust/vendor.tar.xz, offline, as r-universe and CRAN do. A binding
      # that uses items of an unpublished rtemis-r8 fails here.
      R8_CRATES_PATH: ""
      R8_ORACLE: ""
    steps:
      - uses: actions/checkout@v6
      - name: Check that the tree is a release tree
        working-directory: "."
        run: bash tools/check-versions.sh --release
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install the source package
        run: |
          R CMD build --no-manual .
          R CMD INSTALL R8_*.tar.gz
          Rscript -e 'stopifnot(grepl("^[0-9]+[.][0-9]+[.][0-9]+", R8::r8_runtime_version()))'
