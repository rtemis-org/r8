name: Rust CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: rustfmt, clippy, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: Tests with the minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # The minimum version is `rust-version` of the workspace manifest.
      - name: Read the minimum Rust version
        id: msrv
        run: echo "version=$(grep -oE '^rust-version = "[0-9.]+"' Cargo.toml | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo test --workspace --all-features --locked

  wasm32:
    name: rtemis-r8 for wasm32-unknown-emscripten
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # webR builds R packages for wasm32-unknown-emscripten, where usize and
      # isize have 32 bits; the job compiles and lints rtemis-r8 for that
      # target. webR's own build uses nightly Rust with -Z build-std.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
          components: clippy
      - run: cargo clippy -p rtemis-r8 --all-features --target wasm32-unknown-emscripten --locked -- -D warnings
